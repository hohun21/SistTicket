<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SistTicket - 공연 관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .dashboard-card {
            transition: all 0.3s ease;
            border-radius: 1rem;
        }
        .dashboard-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15) !important;
        }
    </style>
</head>
<body>

<div class="container text-center">
    <div class="mb-5">
        <h1 class="fw-bold text-dark mb-2">⚙️ SistTicket 관리자 패널</h1>
        <p class="text-muted">원하시는 관리 항목을 선택해주세요.</p>
    </div>

    <!-- 정가운데 카드 버튼 배치 -->
    <div class="row justify-content-center g-4">
        
        <!-- 1. 콘서트 관리 -->
        <div class="col-md-3">
            <div class="card dashboard-card border-0 shadow-sm p-4 h-100">
                <div class="card-body text-center d-flex flex-column align-items-center justify-content-center">
                    <div class="fs-1 text-primary mb-3"><i class="fa-solid fa-microphone-lines"></i></div>
                    <h4 class="card-title fw-bold mb-2">콘서트 관리</h4>
                    <p class="card-text text-muted small mb-4">공연 등록 및 상세 정보를 관리합니다.</p>
                    <a th:href="@{/settings/concert}" class="btn btn-outline-primary w-100 rounded-pill mt-auto">이동하기</a>
                </div>
            </div>
        </div>

        <!-- 2. 배우 관리 -->
        <div class="col-md-3">
            <div class="card dashboard-card border-0 shadow-sm p-4 h-100">
                <div class="card-body text-center d-flex flex-column align-items-center justify-content-center">
                    <div class="fs-1 text-success mb-3"><i class="fa-solid fa-masks-theater"></i></div>
                    <h4 class="card-title fw-bold mb-2">배우 관리</h4>
                    <p class="card-text text-muted small mb-4">출연진 정보 및 프로필을 관리합니다.</p>
                    <a th:href="@{/settings/actor}" class="btn btn-outline-success w-100 rounded-pill mt-auto">이동하기</a>
                </div>
            </div>
        </div>

        <!-- 3. 장소 관리 -->
        <div class="col-md-3">
            <div class="card dashboard-card border-0 shadow-sm p-4 h-100">
                <div class="card-body text-center d-flex flex-column align-items-center justify-content-center">
                    <div class="fs-1 text-warning mb-3"><i class="fa-solid fa-building-columns"></i></div>
                    <h4 class="card-title fw-bold mb-2">장소 관리</h4>
                    <p class="card-text text-muted small mb-4">공연장 위치 및 수용 인원을 관리합니다.</p>
                    <a th:href="@{/settings/venue}" class="btn btn-outline-warning w-100 rounded-pill mt-auto">이동하기</a>
                </div>
            </div>
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
