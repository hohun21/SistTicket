<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SistTicket - 장소 관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
    <!-- 관리홈으로 가기 -->
    <div>
	    <a th:href="@{/settings/main}" style="text-decoration: none;">
	        <button type="button" 
	                style="padding: 6px 14px; background-color: #f8f9fa; color: #495057; border: 1px solid #ced4da; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s;"
	                onmouseover="this.style.backgroundColor='#e2e6ea'; this.style.borderColor='#adb5bd';"
	                onmouseout="this.style.backgroundColor='#f8f9fa'; this.style.borderColor='#ced4da';">
	            <i class="fa-solid fa-arrow-left me-1"></i> 이전으로
	        </button>
	    </a>
    </div>
<div class="container py-5">
    <!-- 페이지 타이틀 & 상단 액션 바 -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold text-dark mb-1">🏛️ 장소 관리</h2>
            <p class="text-muted small mb-0">공연이 개최되는 장소 및 공연장 정보를 관리합니다.</p>
        </div>
        <!-- 우측 상단 등록 버튼 (모달 호출) -->
        <button class="btn btn-primary shadow-sm" data-bs-toggle="modal" data-bs-target="#venueRegisterModal">
            <i class="fa-solid fa-plus me-1"></i> 새 장소 등록
        </button>
    </div>

    <!-- 검색 및 목록 카드 -->
    <div class="card shadow-sm border-0 rounded-4 p-4 bg-white">
        
        <!-- 검색 폼 -->
        <div class="row mb-3 justify-content-between align-items-center">
            <div class="col-auto">
                <span class="text-muted small">총 <strong class="text-primary" th:text="${venuePage.totalElements}">0</strong>개의 장소가 등록되어 있습니다.</span>
            </div>
            <div class="col-md-4">
                <form th:action="@{/settings/venue}" method="get" class="input-group input-group-sm">
                    <input type="text" name="keyword" class="form-control" placeholder="장소 이름 검색" th:value="${keyword}">
                    <button class="btn btn-outline-secondary" type="submit"><i class="fa-solid fa-search"></i> 검색</button>
                </form>
            </div>
        </div>

        <!-- 테이블 영역 -->
        <div class="table-responsive">
            <table class="table table-hover align-middle text-center">
                <thead class="table-light text-secondary small">
                    <tr>
                        <th style="width: 8%;">ID</th>
                        <th style="width: 22%;">장소 이름</th>
                        <th style="width: 30%;">주소 / 상세주소</th>
                        <th style="width: 15%;">수용 인원</th>
                        <th style="width: 25%;">관리</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="venue : ${venuePage.content}">
                        <td class="fw-bold text-muted" th:text="${venue.venueId}">1</td>
                        <td>
                            <span class="fw-semibold text-dark" th:text="${venue.venueName}">KSPO DOME</span>
                        </td>
                        <td class="text-muted text-start">
                            <div th:text="${venue.address}">서울특별시 송파구</div>
                            <small class="text-secondary" th:text="${venue.detailAddress}">올림픽공원 내</small>
                        </td>
                        <td>
                            <span class="badge bg-secondary" th:text="${#numbers.formatInteger(venue.capacity, 3, 'COMMA') + '명'}">15,000명</span>
                        </td>
                        <td>
                            <button class="btn btn-sm btn-outline-primary px-2 py-1 me-1" 
                                    th:onclick="updateVenue([[${venue.venueId}]], [[${venue.venueName}]], [[${venue.address}]], [[${venue.detailAddress}]], [[${venue.capacity}]])">
                                <i class="fa-solid fa-pen-to-square"></i> 수정
                            </button>
                            <button class="btn btn-sm btn-outline-danger px-2 py-1" 
                                    th:onclick="deleteVenue([[${venue.venueId}]])">
                                <i class="fa-solid fa-trash"></i> 삭제
                            </button>
                        </td>
                    </tr>
                    <tr th:if="${venuePage.empty}">
                        <td colspan="5" class="text-center py-5 text-muted">등록되거나 검색된 장소가 없습니다.</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- 페이징 네비게이션 -->
        <nav th:if="${venuePage.totalPages > 0}" class="mt-4">
            <ul class="pagination justify-content-center mb-0">
                <li class="page-item" th:classappend="${venuePage.first} ? 'disabled'">
                    <a class="page-link" th:href="@{/settings/venue(page=${venuePage.number - 1}, keyword=${keyword})}">이전</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, venuePage.totalPages - 1)}" 
                    th:classappend="${i == venuePage.number} ? 'active'">
                    <a class="page-link" th:href="@{/settings/venue(page=${i}, keyword=${keyword})}" th:text="${i + 1}">1</a>
                </li>
                <li class="page-item" th:classappend="${venuePage.last} ? 'disabled'">
                    <a class="page-link" th:href="@{/settings/venue(page=${venuePage.number + 1}, keyword=${keyword})}">다음</a>
                </li>
            </ul>
        </nav>
    </div>
</div>

<!-- [모달] 새 장소 등록 팝업 -->
<div class="modal fade" id="venueRegisterModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title fs-6"><i class="fa-solid fa-building-user me-1"></i> 새 장소 등록</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form th:action="@{/settings/venue/new}" method="post">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-bold small">장소 이름</label>
                        <input type="text" name="venueName" class="form-control" placeholder="장소 이름을 입력하세요" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold small">주소</label>
                        <input type="text" name="address" class="form-control" placeholder="예: 서울특별시 송파구">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold small">상세 주소</label>
                        <input type="text" name="detailAddress" class="form-control" placeholder="예: 올림픽공원 내">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold small">수용 인원 (Capacity)</label>
                        <input type="number" name="capacity" class="form-control" placeholder="예: 15000" value="1000" required>
                    </div>
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">취소</button>
                    <button type="submit" class="btn btn-primary btn-sm">등록하기</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Bootstrap JS 및 스크립트 -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // 장소 수정 (prompt를 통해 각 필드 값을 순차적으로 입력받아 POST 전송)
    function updateVenue(venueId, currentName, currentAddr, currentDetail, currentCap) {
        const newName = prompt("수정할 장소 이름을 입력하세요:", currentName);
        if (newName === null) return;

        const newAddr = prompt("수정할 주소를 입력하세요:", currentAddr || "");
        if (newAddr === null) return;

        const newDetail = prompt("수정할 상세 주소를 입력하세요:", currentDetail || "");
        if (newDetail === null) return;

        const newCap = prompt("수정할 수용 인원을 입력하세요:", currentCap || 1000);
        if (newCap === null) return;

        // 동적 Form 생성 후 POST /settings/venue/update/{id} 전송
        const form = document.createElement('form');
        form.method = 'post';
        form.action = `/settings/venue/update/${venueId}`;

        const appendInput = (name, value) => {
            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = name;
            input.value = value;
            form.appendChild(input);
        };

        appendInput('venueName', newName);
        appendInput('address', newAddr);
        appendInput('detailAddress', newDetail);
        appendInput('capacity', newCap);

        document.body.appendChild(form);
        form.submit();
    }

    // 장소 삭제 (POST /settings/venue/delete/{id})
    function deleteVenue(venueId) {
        if (!confirm("정말 삭제하시겠습니까? (관련 콘서트의 장소 정보는 NULL로 처리됩니다)")) return;

        const form = document.createElement('form');
        form.method = 'post';
        form.action = `/settings/venue/delete/${venueId}`;
        
        document.body.appendChild(form);
        form.submit();
    }
</script>
</body>
</html>
