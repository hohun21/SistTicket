<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>콘서트 회차 및 캐스팅 관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --admin-primary: #7456df;
            --admin-primary-hover: #6243cf;
            --admin-bg-light: #f0eaff;
            --admin-border: #e8ebf2;
            --admin-text-dark: #202938;
            --admin-text-muted: #7b8497;
        }
        body {
            background-color: #f8f9fc;
            color: var(--admin-text-dark);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .form-card {
            background: #ffffff;
            border: 1px solid var(--admin-border);
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(25, 35, 60, 0.03);
            padding: 28px;
            margin-bottom: 24px;
        }
        h2 {
            color: var(--admin-text-dark);
            font-size: 24px;
            font-weight: 750;
            letter-spacing: -0.8px;
            margin-bottom: 24px;
        }
        h4 {
            font-size: 16px;
            font-weight: 750;
            color: var(--admin-text-dark);
            margin-bottom: 16px;
        }
        label, .form-label {
            font-weight: 700;
            font-size: 13px;
            color: #495467;
            margin-bottom: 6px;
        }
        .form-control, .form-select {
            height: 42px;
            border: 1px solid #e0e5ee;
            border-radius: 9px !important;
            font-size: 13px;
            color: #344054;
        }
        .form-control:focus, .form-select:focus {
            border-color: #8063e7;
            box-shadow: 0 0 0 3px rgba(128, 99, 231, 0.12);
        }
        .btn-theme-primary {
            background: var(--admin-primary);
            border: none;
            color: #ffffff !important;
            font-size: 13px;
            font-weight: 700;
            border-radius: 10px;
            padding: 12px 20px;
            transition: all 0.2s ease;
        }
        .btn-theme-primary:hover {
            background: var(--admin-primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(116, 86, 223, 0.25);
        }
        .alert-info {
            background-color: var(--admin-bg-light);
            border: 1px solid #dfd3ff;
            color: var(--admin-primary);
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
        }
    </style>
</head>
<body>
<div class="container mt-5 mb-5" style="max-width: 800px;">
    <!-- 상단에 부모 공연의 운영 기간 안내 문구 -->
    <div class="alert alert-info py-2.5 mb-4" th:if="${concert != null}">
        📌 **공연 운영 기간:** 
        <span th:text="${#temporals.format(concert.startDate, 'yyyy-MM-dd HH:mm')}">2026-10-20 00:00</span> ~ 
        <span th:text="${#temporals.format(concert.endDate, 'yyyy-MM-dd HH:mm')}">2026-10-22 23:59</span>
    </div>

    <h2 th:text="${performance != null ? '콘서트 회차 및 캐스팅 수정' : '콘서트 회차 및 캐스팅 등록'}">콘서트 회차 및 캐스팅 등록</h2>
    
    <input type="hidden" id="concertId" th:value="${concertId}">
    <input type="hidden" id="performanceId" th:value="${performance != null ? performance.performanceId : ''}">

    <div class="form-card">
        <h4>회차 정보 입력</h4>
        
        <!-- 공연 일시 -->
        <div class="mb-3">
            <label class="form-label">공연 일시</label>
            <input type="datetime-local" id="performanceDate" class="form-control" 
                   th:min="${concert != null and concert.startDate != null ? #temporals.format(concert.startDate, 'yyyy-MM-dd''T''HH:mm') : ''}" 
                   th:max="${concert != null and concert.endDate != null ? #temporals.format(concert.endDate, 'yyyy-MM-dd''T''HH:mm') : ''}"
                   th:value="${performance != null and performance.performanceDate != null ? #temporals.format(performance.performanceDate, 'yyyy-MM-dd''T''HH:mm') : ''}" required>
        </div>

        <!-- 예매 시작일 -->
        <div class="mb-3">
            <label class="form-label">예매 시작일</label>
            <input type="datetime-local" id="bookingStart" class="form-control" 
                   th:value="${performance != null and performance.bookingStart != null ? #temporals.format(performance.bookingStart, 'yyyy-MM-dd''T''HH:mm') : ''}">
        </div>

        <!-- 예매 마감일 -->
        <div class="mb-3">
            <label class="form-label">예매 마감일</label>
            <input type="datetime-local" id="bookingEnd" class="form-control" 
                   th:value="${performance != null and performance.bookingEnd != null ? #temporals.format(performance.bookingEnd, 'yyyy-MM-dd''T''HH:mm') : ''}">
        </div>

        <!-- 실시간 경고 메시지가 출력될 영역 -->
        <div id="validationAlert" class="alert alert-danger d-none mt-2" role="alert" style="border-radius: 9px; font-size: 13px;"></div>

        <!-- 회차 상태 -->
        <div class="mb-0">
            <label class="form-label">회차 상태</label>
            <select id="status" class="form-select">
                <option value="UPCOMING" th:selected="${performance != null and performance.status.name() == 'UPCOMING'}">예매예정</option>
                <option value="ONGOING" th:selected="${performance != null and performance.status.name() == 'ONGOING'}">예매중/공연중</option>
                <option value="FINISHED" th:selected="${performance != null and performance.status.name() == 'FINISHED'}">종료됨</option>
            </select>
        </div>
    </div>

    <!-- 배역별 배우 캐스팅 매핑 영역 -->
    <div class="form-card">
        <h4>캐스팅 설정 (배역별 배우 매칭)</h4>
        <div id="castingContainer">
            <div th:each="role : ${roles}" class="row mb-3 casting-row align-items-center pb-3 border-bottom" style="border-color: var(--admin-border) !important;" th:data-role-id="${role.roleId}">
                <div class="col-md-4">
                    <strong class="text-dark" th:text="${role.roleName}">배역 이름</strong>
                    <p class="text-muted small mb-0" th:text="${role.description}">배역 설명</p>
                </div>
                <div class="col-md-8">
                    <label class="form-label mb-1">출연 배우 선택</label>
                    <select class="form-select actor-select">
                        <option value="">-- 배우 선택 --</option>
                        <option th:each="actor : ${actors}" 
                                th:value="${actor.actorId}" 
                                th:text="${actor.actorName}">배우 이름</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <button type="button" id="submitBtn" class="btn-theme-primary w-100 py-3" onclick="submitPerformance()">저장하기</button>
</div>

<!-- 실시간 유효성 검사 및 기존 캐스팅 세팅 스크립트 -->
<script th:inline="javascript">
    const parentConcertStart = /*[[${concert != null and concert.startDate != null ? #temporals.format(concert.startDate, 'yyyy-MM-dd''T''HH:mm') : '2026-01-01T00:00'}]]*/ '2026-01-01T00:00';
    const parentConcertEnd = /*[[${concert != null and concert.endDate != null ? #temporals.format(concert.endDate, 'yyyy-MM-dd''T''HH:mm') : '2026-12-31T23:59'}]]*/ '2026-12-31T23:59';
    const existingCasts = /*[[${existingCasts}]]*/ [];

    window.onload = function() {
        if (existingCasts && existingCasts.length > 0) {
            const castingRows = document.getElementsByClassName('casting-row');
            for (let row of castingRows) {
                const roleId = parseInt(row.getAttribute('data-role-id'));
                const selectTag = row.querySelector('.actor-select');
                const matchedCast = existingCasts.find(c => c.role.roleId === roleId);
                if (matchedCast && matchedCast.actor) {
                    selectTag.value = matchedCast.actor.actorId;
                }
            }
        }

        document.getElementById('performanceDate').addEventListener('change', validateForm);
        document.getElementById('bookingStart').addEventListener('change', validateForm);
        document.getElementById('bookingEnd').addEventListener('change', validateForm);
    };

    function validateForm() {
        const perfDateVal = document.getElementById('performanceDate').value;
        const bStartVal = document.getElementById('bookingStart').value;
        const bEndVal = document.getElementById('bookingEnd').value;
        const alertBox = document.getElementById('validationAlert');
        const submitBtn = document.getElementById('submitBtn');

        if (!perfDateVal || !bStartVal || !bEndVal) {
            alertBox.classList.add('d-none');
            submitBtn.disabled = false;
            return true;
        }

        const perfDate = new Date(perfDateVal);
        const bStart = new Date(bStartVal);
        const bEnd = new Date(bEndVal);
        const cStart = new Date(parentConcertStart);
        const cEnd = new Date(parentConcertEnd);

        let errorMessage = "";

        if (perfDate < cStart || perfDate > cEnd) {
            errorMessage = "⚠️ 공연 일시는 부모 공연 운영 기간 내에만 설정할 수 있습니다.";
        }
        else if (bStart > bEnd) {
            errorMessage = "⚠️ 예매 시작일은 예매 마감일보다 빠르거나 같아야 합니다.";
        }
        else {
            const latestAllowedEnd = new Date(perfDate.getTime() - 2 * 60 * 60 * 1000);
            if (bEnd > perfDate) {
                errorMessage = "⚠️ 예매 마감일은 공연 일시보다 이전이어야 합니다.";
            } else if (bEnd > latestAllowedEnd) {
                errorMessage = "⚠️ 예매 마감 시간은 퍼포먼스 시작 시간 기준 최소 2시간 전이어야 합니다.";
            }
        }

        if (errorMessage) {
            alertBox.innerText = errorMessage;
            alertBox.classList.remove('d-none');
            submitBtn.disabled = true;
            return false;
        } else {
            alertBox.classList.add('d-none');
            submitBtn.disabled = false;
            return true;
        }
    }

    function submitPerformance() {
        if (!validateForm()) {
            alert("입력된 조건이 올바르지 않습니다. 경고 문구를 확인해주세요.");
            return;
        }

        const concertId = document.getElementById('concertId').value;
        const performanceId = document.getElementById('performanceId').value;
        const performanceDate = document.getElementById('performanceDate').value;
        const bookingStart = document.getElementById('bookingStart').value;
        const bookingEnd = document.getElementById('bookingEnd').value;
        const status = document.getElementById('status').value;

        const castingRows = document.getElementsByClassName('casting-row');
        const casts = [];

        for (let row of castingRows) {
            const roleId = row.getAttribute('data-role-id');
            const actorId = row.querySelector('.actor-select').value;

            if (actorId) {
                casts.push({
                    roleId: parseInt(roleId),
                    actorId: parseInt(actorId)
                });
            }
        }

        const requestData = {
            performanceDate: performanceDate,
            bookingStart: bookingStart ? bookingStart : null,
            bookingEnd: bookingEnd ? bookingEnd : null,
            status: status,
            casts: casts
        };

        const isEdit = performanceId ? true : false;
        const url = isEdit ? `/api/concert/${concertId}/performance/${performanceId}` : `/api/concert/${concertId}/performance`;
        const method = isEdit ? 'PUT' : 'POST';

        fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(requestData)
        })
        .then(response => {
            if (response.ok) {
                alert(isEdit ? "회차가 수정되었습니다!" : "회차가 등록되었습니다!");
                window.location.href = `/settings/concert/${concertId}`;
            } else {
                return response.text().then(text => { throw new Error(text || "처리에 실패했습니다."); });
            }
        })
        .catch(error => {
            alert(error.message);
            console.log("Error:", error);
        });
    }
</script>

</body>
</html>
