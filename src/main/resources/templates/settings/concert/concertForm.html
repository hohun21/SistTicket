<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>콘서트 등록/수정</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --admin-primary: #7456df;
            --admin-primary-hover: #6243cf;
            --admin-bg-light: #f0eaff;
            --admin-border: #e8ebf2;
            --admin-text-dark: #202938;
            --admin-text-muted: #7b8497;
        }
        body {
            background-color: #f8f9fc;
            color: var(--admin-text-dark);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .form-card {
            background: #ffffff;
            border: 1px solid var(--admin-border);
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(25, 35, 60, 0.03);
            padding: 32px;
        }
        h2 {
            color: var(--admin-text-dark);
            font-size: 24px;
            font-weight: 750;
            letter-spacing: -0.8px;
            margin-bottom: 24px;
        }
        label {
            font-weight: 700;
            font-size: 13px;
            color: #495467;
            margin-bottom: 6px;
        }
        .form-control, .form-select {
            height: 42px;
            border: 1px solid #e0e5ee;
            border-radius: 9px !important;
            font-size: 13px;
            color: #344054;
        }
        .form-control:focus, .form-select:focus {
            border-color: #8063e7;
            box-shadow: 0 0 0 3px rgba(128, 99, 231, 0.12);
        }
        textarea.form-control {
            height: auto;
        }
        .btn-theme-primary {
            background: var(--admin-primary);
            border: none;
            color: #ffffff !important;
            font-size: 13px;
            font-weight: 700;
            border-radius: 10px;
            padding: 10px 20px;
            transition: all 0.2s ease;
        }
        .btn-theme-primary:hover {
            background: var(--admin-primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(116, 86, 223, 0.25);
        }
    </style>
</head>
<body>

<div class="container my-5" style="max-width: 700px;">
    <div class="form-card">
        <!-- 등록 / 수정에 따라 제목 변경 -->
        <h2 th:text="${concert != null and concert.concertId != null ? '공연 수정' : '신규 공연 등록'}"></h2>

        <!-- 수정 모드일 때 사용할 concertId 숨김 필드 -->
        <input type="hidden" id="concertId" th:value="${concert != null ? concert.concertId : ''}">

        <div class="mb-3">
            <label>콘서트명</label>
            <input type="text" id="concertName" class="form-control" th:value="${concert != null ? concert.concertName : ''}">
        </div>

        <div class="mb-3">
            <label>시작 일시</label>
            <input type="datetime-local" id="startDate" class="form-control" th:value="${concert != null ? concert.startDate : ''}">
        </div>
        
        <div class="mb-3">
            <label>콘서트 상태</label>
            <select id="status" class="form-select">
                <option value="UPCOMING" th:selected="${concert != null and concert?.status?.name() == 'UPCOMING'}">UPCOMING (공연 예정)</option>
                <option value="ONGOING" th:selected="${concert != null and concert?.status?.name() == 'ONGOING'}">ONGOING (공연 중)</option>
                <option value="FINISHED" th:selected="${concert != null and concert?.status?.name() == 'FINISHED'}">FINISHED (공연 종료)</option>
                <option value="ISCANCELED" th:selected="${concert != null and concert?.status?.name() == 'ISCANCELED'}">ISCANCELED (취소됨)</option>
            </select>
        </div>
        
        <div class="mb-3">
            <label>종료 일시</label>
            <input type="datetime-local" id="endDate" class="form-control" th:value="${concert != null ? concert.endDate : ''}">
        </div>

        <!-- 장소 선택 (ConcertDetailResponseDTO의 venueName과 비교) -->
        <div class="mb-3">
            <label>장소 선택</label>
            <select id="venueId" class="form-select">
                <option value="">장소를 선택하세요</option>
                <th:block th:each="venue : ${venues}">
                    <option th:value="${venue.venueId}" 
                            th:text="${venue.venueName}"
                            th:selected="${concert != null and concert?.venueName == venue.venueName}"></option>
                </th:block>
            </select>
        </div>

        <!-- 장르 선택 (ConcertDetailResponseDTO의 genreName과 비교) -->
        <div class="mb-3">
            <label>장르 선택</label>
            <select id="genreId" class="form-select">
                <option value="">장르를 선택하세요</option>
                <th:block th:each="genre : ${genres}">
                    <option th:value="${genre.genreId}" 
                            th:text="${genre.genreName}"
                            th:selected="${concert != null and concert?.genreName == genre.genreName}"></option>
                </th:block>
            </select>
        </div>

        <div class="mb-3">
            <label>러닝타임 (분)</label>
            <input type="number" id="runTimeMinutes" class="form-control" placeholder="120" th:value="${concert != null ? concert.runTimeMinutes : ''}">
        </div>

        <!-- 이미지 파일 업로드 -->
        <div class="mb-4">
            <label>공연 포스터 및 상세 이미지</label>
            <!-- 기존 썸네일 이미지가 있다면 미리보기 표시 -->
            <div th:if="${concert != null and concert.concertId != null and concert.imgUrl != null}" class="mb-2">
                <img th:src="${concert.imgUrl}" style="height: 100px; object-fit: cover; border-radius: 8px; border: 1px solid var(--admin-border);" alt="기존 이미지">
                <span class="text-muted ms-2 small">(새 이미지를 선택하면 변경됩니다)</span>
            </div>
            <input type="file" id="fileInput" class="form-control" multiple accept="image/*">
            <div id="uploadResultBox" class="mt-2 text-muted small">선택된 파일이 없습니다.</div>
        </div>

        <!-- 버튼 텍스트 변경 -->
        <button type="button" class="btn-theme-primary w-100 py-2.5" 
                onclick="submitConcert()" 
                th:text="${concert != null and concert.concertId != null ? '수정 완료' : '등록 완료'}"></button>
    </div>
</div>

<script>
    document.getElementById('fileInput').addEventListener('change', function(event) {
        const files = event.target.files;
        if (files.length > 0) {
            let html = "";
            for (let i = 0; i < files.length; i++) {
                html += `<span class="badge me-1" style="background: var(--admin-bg-light); color: var(--admin-primary); font-weight: 600;">✔️ ${files[i].name}</span>`;
            }
            document.getElementById('uploadResultBox').innerHTML = html;
        } else {
            document.getElementById('uploadResultBox').innerHTML = "선택된 파일이 없습니다.";
        }
    });

    function submitConcert() {
        const concertId = document.getElementById('concertId').value;
        const isEdit = concertId !== "";

        const formData = new FormData();

        const concertData = {
            concertName: document.getElementById('concertName').value,
            startDate: document.getElementById('startDate').value,
            endDate: document.getElementById('endDate').value,
            venueId: document.getElementById('venueId').value,
            genreId: document.getElementById('genreId').value,
            runTimeMinutes: document.getElementById('runTimeMinutes').value,
            status: document.getElementById('status').value 
        };

        formData.append("dto", new Blob([JSON.stringify(concertData)], { type: "application/json" }));

        const fileInput = document.getElementById('fileInput');
        for (let i = 0; i < fileInput.files.length; i++) {
            formData.append("imageFiles", fileInput.files[i]);
        }

        const url = isEdit ? `/api/concert/${concertId}/update` : '/api/concert';

        fetch(url, {
            method: 'POST',
            body: formData
        })
        .then(response => {
            if (response.ok) return response.json();
            throw new Error(isEdit ? '수정에 실패했습니다.' : '등록에 실패했습니다.');
        })
        .then(resId => {
            alert(isEdit ? '성공적으로 수정되었습니다!' : '성공적으로 등록되었습니다!');
            window.location.href = `/settings/concert/${resId}`;
        })
        .catch(error => {
            alert(error.message);
            console.error('Error:', error);
        });
    }
</script>

</body>
</html>
