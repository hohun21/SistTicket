<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SistTicket - 배우 관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
    <!-- 관리홈으로 가기 -->
    <div>
	    <a th:href="@{/settings/main}" style="text-decoration: none;">
	        <button type="button" 
	                style="padding: 6px 14px; background-color: #f8f9fa; color: #495057; border: 1px solid #ced4da; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s;"
	                onmouseover="this.style.backgroundColor='#e2e6ea'; this.style.borderColor='#adb5bd';"
	                onmouseout="this.style.backgroundColor='#f8f9fa'; this.style.borderColor='#ced4da';">
	            <i class="fa-solid fa-arrow-left me-1"></i> 이전으로
	        </button>
	    </a>
    </div>
<div class="container py-5">
    <!-- 페이지 타이틀 & 상단 액션 바 -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold text-dark mb-1">🎭 배우 관리</h2>
            <p class="text-muted small mb-0">공연에 출연하는 배우 및 아티스트 정보를 관리합니다.</p>
        </div>
        <!-- 우측 상단 등록 버튼 (모달 호출) -->
        <button class="btn btn-primary shadow-sm" data-bs-toggle="modal" data-bs-target="#actorRegisterModal">
            <i class="fa-solid fa-plus me-1"></i> 새 배우 등록
        </button>
    </div>

    <!-- 검색 및 목록 카드 -->
    <div class="card shadow-sm border-0 rounded-4 p-4 bg-white">
        
        <!-- 검색 폼 -->
        <div class="row mb-3 justify-content-between align-items-center">
            <div class="col-auto">
                <span class="text-muted small">총 <strong class="text-primary" th:text="${actorPage.totalElements}">0</strong>명의 배우가 등록되어 있습니다.</span>
            </div>
            <div class="col-md-4">
                <form th:action="@{/settings/actor}" method="get" class="input-group input-group-sm">
                    <input type="text" name="keyword" class="form-control" placeholder="배우 이름 검색" th:value="${keyword}">
                    <button class="btn btn-outline-secondary" type="submit"><i class="fa-solid fa-search"></i> 검색</button>
                </form>
            </div>
        </div>

        <!-- 테이블 영역 -->
        <div class="table-responsive">
            <table class="table table-hover align-middle text-center">
                <thead class="table-light text-secondary small">
                    <tr>
                        <th style="width: 10%;">ID</th>
                        <th style="width: 25%;">배우 이름</th>
                        <th style="width: 45%;">설명</th>
                        <th style="width: 20%;">관리</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="actor : ${actorPage.content}">
                        <td class="fw-bold text-muted" th:text="${actor.actorId}">1</td>
                        <td>
                            <span class="fw-semibold text-dark" th:text="${actor.actorName}">홍길동</span>
                        </td>
                        <td class="text-muted text-start text-truncate" style="max-width: 300px;" th:text="${actor.description ?: '설명 없음'}">설명 내용</td>
                        <td>
                            <button class="btn btn-sm btn-outline-primary px-2 py-1 me-1" 
                                    th:onclick="updateActor([[${actor.actorId}]], [[${actor.actorName}]], [[${actor.description}]])">
                                <i class="fa-solid fa-pen-to-square"></i> 수정
                            </button>
                            <button class="btn btn-sm btn-outline-danger px-2 py-1" 
                                    th:onclick="deleteActor([[${actor.actorId}]])">
                                <i class="fa-solid fa-trash"></i> 삭제
                            </button>
                        </td>
                    </tr>
                    <tr th:if="${actorPage.empty}">
                        <td colspan="4" class="text-center py-5 text-muted">등록되거나 검색된 배우가 없습니다.</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- 페이징 네비게이션 -->
        <nav th:if="${actorPage.totalPages > 0}" class="mt-4">
            <ul class="pagination justify-content-center mb-0">
                <li class="page-item" th:classappend="${actorPage.first} ? 'disabled'">
                    <a class="page-link" th:href="@{/settings/actor(page=${actorPage.number - 1}, keyword=${keyword})}">이전</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, actorPage.totalPages - 1)}" 
                    th:classappend="${i == actorPage.number} ? 'active'">
                    <a class="page-link" th:href="@{/settings/actor(page=${i}, keyword=${keyword})}" th:text="${i + 1}">1</a>
                </li>
                <li class="page-item" th:classappend="${actorPage.last} ? 'disabled'">
                    <a class="page-link" th:href="@{/settings/actor(page=${actorPage.number + 1}, keyword=${keyword})}">다음</a>
                </li>
            </ul>
        </nav>
    </div>
</div>

<!-- [모달] 새 배우 등록 팝업 -->
<div class="modal fade" id="actorRegisterModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title fs-6"><i class="fa-solid fa-user-plus me-1"></i> 새 배우 등록</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <!-- 컨트롤러의 /settings/actor/new 로 form 전송 -->
            <form th:action="@{/settings/actor/new}" method="post">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-bold small">배우 이름</label>
                        <input type="text" name="actorName" class="form-control" placeholder="배우 이름을 입력하세요" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold small">배우 설명</label>
                        <textarea name="description" class="form-control" rows="3" placeholder="배우에 대한 간단한 설명을 입력하세요"></textarea>
                    </div>
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">취소</button>
                    <button type="submit" class="btn btn-primary btn-sm">등록하기</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Bootstrap JS 및 스크립트 -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // 배우 수정 (prompt 활용 및 form 전송 방식 연동)
    function updateActor(actorId, currentName, currentDesc) {
        const newName = prompt("수정할 배우 이름을 입력하세요:", currentName);
        if (newName === null) return;

        const newDesc = prompt("수정할 배우 설명을 입력하세요:", currentDesc || "");

        // 동적으로 Form을 생성해서 POST /settings/actor/update/{id} 전송
        const form = document.createElement('form');
        form.method = 'post';
        form.action = `/settings/actor/update/${actorId}`;

        const nameInput = document.createElement('input');
        nameInput.type = 'hidden';
        nameInput.name = 'actorName';
        nameInput.value = newName;
        form.appendChild(nameInput);

        const descInput = document.createElement('input');
        descInput.type = 'hidden';
        descInput.name = 'description';
        descInput.value = newDesc;
        form.appendChild(descInput);

        document.body.appendChild(form);
        form.submit();
    }

    // 배우 삭제 (동적 Form 생성 후 POST /settings/actor/delete/{id} 전송)
    function deleteActor(actorId) {
        if (!confirm("정말 삭제하시겠습니까? (연관된 캐스팅의 배우 정보는 NULL로 처리됩니다)")) return;

        const form = document.createElement('form');
        form.method = 'post';
        form.action = `/settings/actor/delete/${actorId}`;
        
        document.body.appendChild(form);
        form.submit();
    }
</script>
</body>
</html>
