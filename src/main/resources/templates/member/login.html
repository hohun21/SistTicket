<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SistTicket | 로그인</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #11131a;
            color: #f4f4f6;
            font-family: Arial, "Malgun Gothic", sans-serif;
            padding: 24px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo a {
            color: #e8b86d;
            font-size: 30px;
            font-weight: 800;
            text-decoration: none;
            letter-spacing: -1px;
        }

        .logo p {
            margin-top: 8px;
            color: #858795;
            font-size: 12px;
            letter-spacing: 3px;
        }

        .login-card {
            padding: 36px;
            background: #1b1d26;
            border: 1px solid #30323d;
            border-radius: 16px;
        }

        .heading {
            text-align: center;
            margin-bottom: 32px;
        }

        .heading span {
            color: #e8b86d;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .heading h1 {
            margin: 12px 0;
            font-size: 28px;
        }

        .heading p {
            color: #999cab;
            font-size: 14px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 9px;
            font-size: 14px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            height: 48px;
            padding: 0 14px;
            border: 1px solid #3b3e4b;
            border-radius: 8px;
            background: #14161d;
            color: white;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: #e8b86d;
        }

        .form-group input::placeholder {
            color: #737687;
        }

        .login-button {
            width: 100%;
            height: 50px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            background: #e8b86d;
            color: #191919;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .login-button:hover {
            background: #f2ca8c;
        }

        .error-message {
            margin-bottom: 18px;
            padding: 12px;
            border-radius: 8px;
            background: #382126;
            color: #ff9eaa;
            font-size: 13px;
        }

        .signup {
            margin-top: 26px;
            text-align: center;
            color: #999cab;
            font-size: 14px;
        }

        .signup a,
        .find-links a {
            color: #e8b86d;
            text-decoration: none;
        }

        .signup a {
            margin-left: 6px;
            font-weight: 600;
        }

        .find-links {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 22px;
            font-size: 12px;
        }

        .find-links a {
            color: #a5a7b0;
        }

        .find-links span {
            color: #454754;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 28px 22px;
            }

            .heading h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>
<div class="login-container">

    <header class="logo">
        <a th:href="@{/}">SistTicket</a>
        <p>YOUR NEXT STAGE</p>
    </header>

    <main class="login-card">

        <div class="heading">
            <span>WELCOME BACK</span>
            <h1>로그인</h1>
            <p>
                보고 싶었던 무대,<br>
                지금 만나보세요.
            </p>
        </div>

        <!-- Spring Security 로그인 실패 시 -->
        <div class="error-message"
             th:if="${param.error}">
            아이디 또는 비밀번호를 확인해 주세요.
        </div>

        <!-- 로그아웃 후 -->
        <div class="error-message"
             th:if="${param.logout}"
             style="background: #203329; color: #9ce2b8;">
            로그아웃되었습니다.
        </div>

        <form th:action="@{/login}" method="post">

            <div class="form-group">
                <label for="username">아이디</label>
                <input type="text"
                       id="username"
                       name="username"
                       placeholder="아이디를 입력하세요"
                       autocomplete="username"
                       required>
            </div>

            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password"
                       id="password"
                       name="password"
                       placeholder="비밀번호를 입력하세요"
                       autocomplete="current-password"
                       required>
            </div>



            <button type="submit" class="login-button">
                로그인
            </button>

        </form>

        <div class="signup">
            아직 회원이 아니신가요?
            <a th:href="@{/signup}">회원가입</a>
        </div>

        <div class="find-links">
            <a th:href="@{/member/find-id}">아이디 찾기</a>
            <span>|</span>
            <a th:href="@{/member/find-password}">비밀번호 찾기</a>
        </div>

    </main>
</div>
</body>
</html>
