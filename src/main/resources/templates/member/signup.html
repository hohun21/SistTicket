<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="shortcut icon" type="image/x-icon" href="/images/SiSt.ico">
  <title>회원가입 - HOON HOme</title>

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <link rel="stylesheet" href="/resources/cdn-main/example.css">
  <script src="/resources/cdn-main/example.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background-color: #f5f6f8;
      color: #222;
      font-family: Arial, sans-serif;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 25px 40px;
      background-color: white;
      border-bottom: 1px solid #ddd;
    }

    h1.main {
      margin: 0;
      font-size: 28px;
    }

    h1.main a {
      color: #222;
      text-decoration: none;
    }

    header ul {
      display: flex;
      gap: 20px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    header ul a {
      color: #333;
      text-decoration: none;
    }

    .signup-container {
      width: 100%;
      max-width: 480px;
      margin: 60px auto;
      padding: 40px;
      background-color: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
    }

    .signup-title {
      margin: 0 0 10px;
      text-align: center;
      font-size: 28px;
    }

    .signup-description {
      margin-bottom: 30px;
      color: #777;
      text-align: center;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      height: 46px;
      padding: 0 13px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 15px;
      outline: none;
    }

    .form-group input:focus {
      border-color: #333;
    }

    .signup-button {
      width: 100%;
      height: 48px;
      margin-top: 10px;
      border: none;
      border-radius: 6px;
      background-color: #222;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .signup-button:hover {
      background-color: #444;
    }

    .login-link {
      margin-top: 25px;
      text-align: center;
      font-size: 14px;
      color: #777;
    }

    .login-link a {
      margin-left: 5px;
      color: #222;
      font-weight: bold;
      text-decoration: none;
    }

    @media (max-width: 520px) {
      .signup-container {
        width: auto;
        margin: 30px 15px;
        padding: 25px;
      }

      header {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1 class="main">
    <a href="/">HOON HOme</a>
  </h1>

  <ul>
    <li><a th:href="@{/login}">로그인</a></li>
    <li><a th:href="@{/signup}">회원가입</a></li>
  </ul>
</header>

<main>
  <div class="signup-container">

    <h2 class="signup-title">회원가입</h2>
    <p class="signup-description">
      HOON HOme의 회원이 되어보세요.
    </p>

    <form th:action="@{/signup}" method="post">

      <div class="form-group">
        <label for="email">이메일</label>
        <input type="email"
               id="email"
               name="email"
               placeholder="example@email.com"
               autocomplete="email"
               required>
      </div>

      <div class="form-group">
        <label for="password">비밀번호</label>
        <input type="password"
               id="password"
               name="password"
               placeholder="비밀번호를 입력하세요."
               autocomplete="new-password"
               minlength="8"
               required>
      </div>

      <div class="form-group">
        <label for="name">이름</label>
        <input type="text"
               id="name"
               name="name"
               placeholder="이름을 입력하세요."
               autocomplete="name"
               required>
      </div>

      <div class="form-group">
        <label for="phone">전화번호</label>
        <input type="tel"
               id="phone"
               name="phone"
               placeholder="010-1234-5678"
               autocomplete="tel"
               required>
      </div>

      <button type="submit" class="signup-button">
        회원가입
      </button>

    </form>

    <div class="login-link">
      이미 회원이신가요?
      <a th:href="@{/login}">로그인</a>
    </div>

  </div>
</main>

</body>
</html>
