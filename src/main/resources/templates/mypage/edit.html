<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원 정보 수정 | SistTicket</title>
    <style>
        body {
            background-color: #0b0c10;
            color: #f4f4f6;
            font-family: 'Pretendard', sans-serif;
            margin: 0;
            padding: 0;
        }
        .mypage-container {
            display: flex;
            max-width: 1200px;
            margin: 50px auto;
            gap: 40px;
            padding: 0 20px;
        }
        
        /* 좌측 사이드바 스타일 */
        .sidebar {
            width: 250px;
            flex-shrink: 0;
        }
        .sidebar h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 24px;
        }
        .sidebar ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .sidebar li {
            margin-bottom: 10px;
        }
        .sidebar a {
            display: block;
            padding: 12px 16px;
            color: #999cab;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .sidebar a:hover, .sidebar a.active {
            background: #1b1d26;
            color: #f4f4f6;
            font-weight: bold;
        }
        .sidebar a.danger {
            color: #ff4d4d;
        }
        .sidebar a.danger:hover {
            background: rgba(255, 77, 77, 0.1);
        }

        /* 우측 메인 콘텐츠 스타일 */
        .content {
            flex-grow: 1;
            background: #1b1d26;
            padding: 40px;
            border-radius: 16px;
            border: 1px solid #30323d;
        }
        .content h1 {
            margin-top: 0;
            font-size: 22px;
            margin-bottom: 10px;
        }
        .content .subtitle {
            color: #999cab;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* 폼 스타일 */
        .form-group {
            margin-bottom: 25px;
        }
        .form-group label {
            display: block;
            color: #999cab;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #30323d;
            background: #11131a;
            color: #f4f4f6;
            box-sizing: border-box;
            font-size: 15px;
        }
        .form-group input:focus {
            outline: none;
            border-color: #4f46e5;
        }
        .form-group input[readonly] {
            background: #2a2c36;
            color: #7a7c8a;
            cursor: not-allowed;
            border-color: transparent;
        }
        
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .submit-btn:hover {
            background: #4338ca;
        }
    </style>
</head>
<body>

<div class="mypage-container">
    <aside class="sidebar">
        <h2>마이페이지</h2>
        <ul>
            <li><a th:href="@{/mypage}">예매 내역</a></li>
            <li><a th:href="@{/mypage/verify(target='edit')}" class="active">회원 정보 수정</a></li>
            <li><a th:href="@{/mypage/verify(target='withdraw')}" class="danger">회원 탈퇴</a></li>
        </ul>
    </aside>

    <main class="content">
        <h1>회원 정보 수정</h1>
        <p class="subtitle">안전한 서비스 이용을 위해 개인 정보를 최신 상태로 유지해 주세요.<br>이름과 이메일은 변경할 수 없습니다.</p>

        <form onsubmit="submitEdit(event)">
            <div class="form-group">
                <label>이메일 (아이디)</label>
                <input type="text" th:value="${member.email}" readonly>
            </div>
            
            <div class="form-group">
                <label>이름</label>
                <input type="text" th:value="${member.name}" readonly>
            </div>
            
            <div class="form-group">
                <label>전화번호</label>
                <input type="text" id="phone" th:value="${member.phone}" required>
            </div>
            
            <div class="form-group">
                <label>새 비밀번호</label>
                <input type="password" id="password" placeholder="변경할 경우에만 입력해 주세요. (기존 비밀번호 유지 시 비워두세요)">
            </div>
            
            <button type="submit" class="submit-btn">수정 완료</button>
        </form>
    </main>
</div>

<script>
    async function submitEdit(event) {
        event.preventDefault();

        const phone = document.getElementById('phone').value;
        const password = document.getElementById('password').value;

        const requestData = {
            phone: phone,
            password: password
        };

        try {
            const response = await fetch('/api/mypage/edit', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(requestData)
            });

            const result = await response.json();

            if (response.ok && result.success) {
                alert(result.message);
                window.location.href = '/mypage';
            } else {
                alert(result.message || '정보 수정 중 오류가 발생했습니다.');
                if (response.status === 403) {
                    window.location.href = '/mypage/verify?target=edit';
                }
            }
        } catch (error) {
            console.error('Error:', error);
            alert('서버와 통신 중 오류가 발생했습니다.');
        }
    }
</script>

</body>
</html>
