<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SistTicket - 공연 목록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container my-5">
		<!-- 💡 상단 헤더 및 등록하러 가기 버튼 -->
		<div class="d-flex justify-content-between align-items-center mb-4">
		    <h2 class="fw-bold m-0">🎭 전체 공연 목록</h2>
		    <a th:href="@{/concert/new}" class="btn btn-dark fw-bold">➕ 콘서트 등록하기</a>
		</div>
        <!-- Card List  -->
        <div class="row row-cols-1 row-cols-md-3 g-4">
            <th:block th:if="${concertList != null and !concertList.isEmpty()}">
                <div class="col" th:each="concert : ${concertList}">
                    <div class="card h-100 shadow-sm">
						
						<!-- 💡 카드 우측 상단 모서리에 위치한 수정 버튼 -->
						<a th:href="@{/admin/concert/edit/{id}(id=${concert.concertId})}" 
						   class="position-absolute top-0 end-0 m-2 btn btn-sm btn-light shadow-sm fw-bold text-dark" 
						   style="background-color: rgba(255, 255, 255, 0.9);">
						   ✏️ 수정
						</a>
                        <!-- 썸네일 이미지 출력 영역 -->
                        <img th:src="${concert.imgUrl}" class="card-img-top" alt="공연 포스터" style="height: 250px; object-fit: cover;">
                        
                        <div class="card-body">
                            <!-- 장르 배지 -->
                            <span class="badge bg-secondary mb-2" th:text="${concert.genreName}">장르</span>
                            
                            <!-- 공연 제목 -->
                            <h5 class="card-title fw-bold" th:text="${concert.concertName}">공연 제목</h5>
                            
                            <!-- 공연장 위치 -->
                            <p class="card-text text-muted small mb-1" th:text="${concert.venueName}">공연장 이름</p>
                            
                            <!-- 공연 기간 -->
                            <p class="card-text small text-secondary">
                                <span th:text="${#temporals.format(concert.startDate, 'yyyy-MM-dd')}">시작일</span> ~ 
                                <span th:text="${#temporals.format(concert.endDate, 'yyyy-MM-dd')}">종료일</span>
                            </p>
                        </div>
                        
                        <div class="card-footer bg-white border-top-0">
                            <!-- 상세 보기 링크 (Concert ID) -->
                            <a th:href="@{/concert/{id}(id=${concert.concertId})}" class="btn btn-outline-primary w-100">상세보기 및 예매</a>
                        </div>
                    </div>
                </div>
            </th:block>

            <!-- 등록된 콘서트가 없을 경우 -->
            <th:block th:if="${concertList == null or concertList.isEmpty()}">
                <div class="col-12 text-center py-5">
                    <p class="text-muted">현재 등록된 공연이 없습니다.</p>
                </div>
            </th:block>
        </div>
    </div>

</body>
</html>
