<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SistTicket - 공연 목록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container my-5">
        <h2 class="mb-4 fw-bold">🎭 전체 공연 목록</h2>
        
        <div class="row row-cols-1 row-cols-md-3 g-4">
            <!-- 1번 카드 -->
            <div class="col">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <span class="badge bg-secondary mb-2">아이돌</span>
                        <h5 class="card-title fw-bold">아이유 단독 콘서트 - The Winning [서울]</h5>
                        <p class="card-text text-muted small mb-1">잠실 주경기장</p>
                        <p class="card-text small">2026-11-05 ~ 2026-11-05</p>
                    </div>
                    <div class="card-footer bg-white border-top-0">
                        <a href="/concert/1" class="btn btn-outline-primary w-100">상세보기 및 예매</a>
                    </div>
                </div>
            </div>

            <!-- 2번 카드 -->
            <div class="col">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <span class="badge bg-secondary mb-2">뮤지컬</span>
                        <h5 class="card-title fw-bold">뮤지컬 &lt;레미제라블&gt; [서울]</h5>
                        <p class="card-text text-muted small mb-1">블루스퀘어 신한카드홀</p>
                        <p class="card-text small">2026-10-01 ~ 2026-10-31</p>
                    </div>
                    <div class="card-footer bg-white border-top-0">
                        <a href="/concert/2" class="btn btn-outline-primary w-100">상세보기 및 예매</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
