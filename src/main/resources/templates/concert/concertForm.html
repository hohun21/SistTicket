<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>콘서트 등록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container my-5" style="max-width: 700px; background: white; padding: 30px; border-radius: 8px;">
    <h2>🎭 신규 콘서트 등록</h2>

    <div class="mb-3">
        <label>콘서트명</label>
        <input type="text" id="concertName" class="form-control">
    </div>

    <div class="mb-3">
        <label>시작 일시</label>
        <input type="datetime-local" id="startDate" class="form-control">
    </div>

    <div class="mb-3">
        <label>종료 일시</label>
        <input type="datetime-local" id="endDate" class="form-control">
    </div>

    <div class="mb-3">
        <label>장소 선택</label>
        <select id="venueId" class="form-select">
            <option value="">장소를 선택하세요</option>
            <th:block th:each="venue : ${venues}">
                <option th:value="${venue.venueId}" th:text="${venue.venueName}"></option>
            </th:block>
        </select>
    </div>

    <div class="mb-3">
        <label>장르 선택</label>
        <select id="genreId" class="form-select">
            <option value="">장르를 선택하세요</option>
            <th:block th:each="genre : ${genres}">
                <option th:value="${genre.genreId}" th:text="${genre.genreName}"></option>
            </th:block>
        </select>
    </div>

    <div class="mb-3">
        <label>러닝타임 (분)</label>
        <input type="number" id="runTimeMinutes" class="form-control" placeholder="120">
    </div>

    <!-- 💡 파일 업로드 영역 (이미지 선택 즉시 /uploadAjax 태우기) -->
    <div class="mb-3">
        <label>공연 포스터 및 상세 이미지</label>
        <input type="file" id="fileInput" class="form-control" multiple accept="image/*" onchange="uploadImages(this)">
        <div id="uploadResultBox" class="mt-2 text-muted small">업로드된 파일이 없습니다.</div>
    </div>

    <button type="button" class="btn btn-primary w-100" onclick="submitConcert()">등록 완료</button>
</div>

<script>
    // 서버에 업로드된 파일들의 정보를 담아둘 배열
    let uploadedImageDTOs = [];

    // 1. 파일 선택 시 비동기 업로드 수행 (/uploadAjax 활용)
    function uploadImages(input) {
        const formData = new FormData();
        for (let i = 0; i < input.files.length; i++) {
            formData.append("uploadFiles", input.files[i]);
        }

        fetch('/uploadAjax', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            console.log("업로드 결과:", data);
            uploadedImageDTOs = uploadedImageDTOs.concat(data); // 결과 누적
            
            let html = "";
            uploadedImageDTOs.forEach(img => {
                html += `<span class="badge bg-secondary me-1">✔️ ${img.fileName}</span>`;
            });
            document.getElementById('uploadResultBox').innerHTML = html;
        })
        .catch(err => console.error("업로드 에러:", err));
    }

    // 2. 최종 콘서트 등록 요청 (JSON 전송)
    function submitConcert() {
        const requestData = {
            concertName: document.getElementById('concertName').value,
            startDate: document.getElementById('startDate').value,
            endDate: document.getElementById('endDate').value,
            venueId: document.getElementById('venueId').value,
            genreId: document.getElementById('genreId').value,
            runTimeMinutes: document.getElementById('runTimeMinutes').value,
            imageDTOs: uploadedImageDTOs // 💡 비동기로 미리 확보한 파일 정보 목록 전달
        };

        fetch('/api/concert', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(requestData)
        })
        .then(response => {
            if (response.ok) return response.json();
            throw new Error('콘서트 등록에 실패했습니다.');
        })
        .then(concertId => {
            alert('성공적으로 등록되었습니다!');
            window.location.href = `/concert/${concertId}`;
        })
        .catch(error => {
            alert(error.message);
            console.error('Error:', error);
        });
    }
</script>

</body>
</html>
