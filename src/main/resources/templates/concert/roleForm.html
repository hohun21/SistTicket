<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>콘서트 배역 관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>콘서트 배역 관리</h2>
    <input type="hidden" id="concertId" th:value="${concertId}">

    <!-- 새 배역 등록 폼 -->
    <div class="card p-4 shadow-sm mb-4">
        <h4>새 배역 추가</h4>
        <div class="mb-3">
            <label class="form-label">배역 이름 (예: 엘리자벳, 토텐)</label>
            <input type="text" id="roleName" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">배역 설명</label>
            <input type="text" id="description" class="form-control">
        </div>
        <button type="button" class="btn btn-primary" onclick="registerRole()">배역 추가하기</button>
    </div>

    <!-- 등록된 배역 목록 -->
    <div class="card p-4 shadow-sm">
        <h4>등록된 배역 목록</h4>
        <ul class="list-group mt-3" id="roleList">
            <li th:each="role : ${roles}" class="list-group-item d-flex justify-content-between align-items-center">
                <div>
                    <strong th:text="${role.roleName}">배역 이름</strong>
                    <span class="text-muted ms-2" th:text="${role.description}">설명</span>
                </div>
				
				<div>
				    <!-- [수정] 버튼 추가: 타임리프 따옴표와 문자열 파라미터 전달 방식 주의 -->
				    <button class="btn btn-sm btn-outline-secondary me-1" 
				            th:onclick="updateRole([[${role.roleId}]], [[${role.roleName}]], [[${role.description}]])">수정</button>
				    
				    <!-- [삭제] 버튼 -->
				    <button class="btn btn-sm btn-danger" th:onclick="'deleteRole(' + ${role.roleId} + ')'">삭제</button>
				</div>
               
            </li>
        </ul>
    </div>
    
    <div class="mt-4">
        <a th:href="@{/concert/{id}(id=${concertId})}" class="btn btn-secondary">콘서트 상세로 돌아가기</a>
    </div>
</div>

<script>
    function registerRole() {
        const concertId = document.getElementById('concertId').value;
        const roleName = document.getElementById('roleName').value;
        const description = document.getElementById('description').value;

        if (!roleName) {
            alert("배역 이름을 입력해주세요.");
            return;
        }

        fetch(`/api/concert/${concertId}/roles`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ roleName, description })
        })
        .then(response => {
            if (response.ok) {
                location.reload(); // 성공 시 새로고침하여 목록 갱신
            } else {
                alert("배역 등록에 실패했습니다.");
            }
        });
    }

    function deleteRole(roleId) {
        if (!confirm("정말 이 배역을 삭제하시겠습니까?")) return;
        const concertId = document.getElementById('concertId').value;

        fetch(`/api/concert/${concertId}/roles/${roleId}`, {
            method: 'DELETE'
        })
        .then(response => {
            if (response.ok) {
                location.reload();
            } else {
                alert("삭제에 실패했습니다.");
            }
        });
    }
</script>
<script>
	function updateRole(roleId, currentName, currentDesc) {
	    const concertId = document.getElementById('concertId').value;
	    const newName = prompt("수정할 배역 이름을 입력하세요:", currentName);
	    if (newName === null) return; // 취소 누름

	    const newDesc = prompt("수정할 배역 설명을 입력하세요:", currentDesc);

	    fetch(`/api/concert/${concertId}/roles/${roleId}`, {
	        method: 'PUT',
	        headers: { 'Content-Type': 'application/json' },
	        body: JSON.stringify({ roleName: newName, description: newDesc })
	    })
	    .then(response => {
	        if (response.ok) {
	            location.reload(); // 새로고침해서 변경된 목록 반영
	        } else {
	            alert("배역 수정에 실패했습니다.");
	        }
	    });
	}	

</script>
</body>
</html>
