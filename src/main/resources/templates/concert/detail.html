<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SistTicket - 공연 상세</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container my-5">
        <!-- 상단 콘서트 기본 정보 -->
        <div class="card shadow-sm mb-4">
            <div class="card-body p-4">
                <span class="badge bg-primary mb-2" th:text="${concert.genreName}">장르</span>
                <h1 class="display-6 fw-bold" th:text="${concert.concertName}">콘서트 제목</h1>
                <hr>
                <p><strong>공연장:</strong> <span th:text="${concert.venueName}">공연장명</span> (<span th:text="${concert.venueAddress}">주소</span>)</p>
                <p><strong>공연 기간:</strong> <span th:text="${#temporals.format(concert.startDate, 'yyyy-MM-dd HH:mm')}">시작</span> ~ <span th:text="${#temporals.format(concert.endDate, 'yyyy-MM-dd HH:mm')}">종료</span></p>
            </div>
        </div>

        <!-- 하단 회차 및 캐스팅 일정 -->
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h3 class="fw-bold mb-3">🎫 회차 및 캐스팅 일정</h3>
                
                <div class="list-group">
                    <div class="list-group-item py-3" th:for="${perf : performanceList}">
                        <div class="d-flex w-100 justify-content-between align-items-center">
                            <div>
                                <h5 class="mb-1 fw-bold" th:text="${#temporals.format(perf.performanceDate, 'yyyy-MM-dd (E) HH:mm')}">공연 일시</h5>
                                <p class="mb-1 text-muted small">
                                    예매 가능 기간: <span th:text="${#temporals.format(perf.bookingStart, 'MM-dd HH:mm')}"></span> ~ 
                                    <span th:text="${#temporals.format(perf.bookingEnd, 'MM-dd HH:mm')}"></span>
                                </p>
                            </div>
                            <div>
                                <span class="badge bg-success" th:if="${perf.status.name() == 'ONGOING'}">예매중</span>
                                <span class="badge bg-warning text-dark" th:if="${perf.status.name() == 'UPCOMING'}">예매예정</span>
                                <span class="badge bg-secondary" th:if="${perf.status.name() == 'FINISHED'}">공연종료</span>
                            </div>
                        </div>
                        
                        <!-- 해당 회차의 캐스팅 정보 출력 영역 -->
                        <div class="mt-3 p-2 bg-light rounded">
                            <small class="fw-bold text-secondary">출연진 (Cast):</small>
                            <ul class="mb-0 small">
                                <li th:for="${cast : perf.casts}">
                                    <span th:text="${cast.role.roleName}">역할명</span> : <strong th:text="${cast.actor.actorName}">배우명</strong>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="mt-4">
            <a href="/concert/list" class="btn btn-secondary">목록으로 돌아가기</a>
        </div>
    </div>

</body>
</html>
