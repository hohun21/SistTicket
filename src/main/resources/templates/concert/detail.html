<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SistTicket - 공연 상세</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container my-5">
     <a class="page-link" th:href="@{/concert/list}">  <h4>◀ 목록 보기</h4> </a>
        <!-- 상단: 공연 기본 정보 영역 (포스터 + 기본 개요) -->
        <div class="row bg-white p-4 rounded shadow-sm mb-4">
            <!-- 좌측: 공연 포스터 -->
            <div class="col-md-4 text-center">
                <img th:src="${concert.imgUrl}" class="img-fluid rounded shadow" alt="공연 포스터" style="max-height: 400px; object-fit: cover;">
            </div>
            
            <!-- 우측: 상세 정보 및 예매 요약 -->
            <div class="col-md-8 d-flex flex-column justify-content-between">
                <div>
                    <span class="badge bg-primary mb-2" th:text="${concert.genreName}">장르</span>
                    <h2 class="fw-bold mb-3" th:text="${concert.concertName}">공연 제목</h2>
                    
                    <ul class="list-unstyled text-muted small mb-4">
                        <li class="mb-2"><strong>장소:</strong> <span th:text="${concert.venueName}">공연장 이름</span> (<span th:text="${concert.venueAddress}">주소</span>)
							<!-- 러닝타임 출력 예시 -->
							<p class="card-text">
							    <strong>러닝타임:</strong> 
							    <span th:text="${concert.runTimeMinutes != null ? concert.runTimeMinutes + '분' : '정보 없음'}">120분</span>
							</p>
							</li>
                        <li class="mb-2">
                            <strong>공연 기간:</strong> 
                            <span th:text="${#temporals.format(concert.startDate, 'yyyy-MM-dd')}">시작일</span> ~ 
                            <span th:text="${#temporals.format(concert.endDate, 'yyyy-MM-dd')}">종료일</span>
                        </li>
                        <li class="mb-2"><strong>상태:</strong> <span class="text-success fw-bold" th:text="${concert.status}">상태</span></li>
                    </ul>
                </div>
                
                <!-- 예매하기 버튼 영역 (하단 고정 느낌) -->
                <div>
                    <a href="#performanceSection" class="btn btn-dark btn-lg w-100">예매하기 / 회차 선택</a>
                </div>
            </div>
        </div>

        <!-- 하단: 회차 일정 및 캐스팅 정보 선택 영역 -->
        <div id="performanceSection" class="bg-white p-4 rounded shadow-sm">
            <h4 class="fw-bold mb-4 border-bottom pb-2">🎟️ 회차 및 캐스팅 일정 선택</h4>

            <!-- 회차 리스트 반복 -->
            <div class="accordion" id="performanceAccordion">
                <div class="accordion-item mb-3 border" th:each="perf, iterStat : ${concert.performanceList}">
                    <h2 class="accordion-header" th:id="'heading' + ${iterStat.index}">
                        <button class="accordion-button" type="button" data-bs-toggle="collapse" 
                                th:data-bs-target="'#collapse' + ${iterStat.index}" aria-expanded="true" 
                                th:aria-controls="'collapse' + ${iterStat.index}">
                            <div class="w-100 d-flex justify-content-between align-items-center pe-3">
                                <span class="fw-bold text-dark">
                                    [회차 <span th:text="${iterStat.count}">1</span>] 
                                    <span th:text="${#temporals.format(perf.performanceDate, 'yyyy-MM-dd HH:mm')}">공연 일시</span>
                                </span>
                                <span class="badge bg-secondary" th:text="${perf.status}">상태</span>
                            </div>
                        </button>
                    </h2>
                    
                    <div th:id="'collapse' + ${iterStat.index}" class="accordion-collapse collapse show" 
                         th:aria-labelledby="'heading' + ${iterStat.index}" data-bs-parent="#performanceAccordion">
                        <div class="accordion-body bg-light">
                            <p class="small text-muted mb-2">
                                예매 가능 기간: 
                                <span th:text="${#temporals.format(perf.bookingStart, 'yyyy-MM-dd HH:mm')}">시작</span> ~ 
                                <span th:text="${#temporals.format(perf.bookingEnd, 'yyyy-MM-dd HH:mm')}">마감</span>
                            </p>
                            
                            <hr class="my-2">
                            
                            <!-- 캐스팅 정보 출력 -->
                            <h6 class="fw-bold text-secondary small mb-2">출연진 캐스팅</h6>
                            <div class="row row-cols-1 row-cols-md-3 g-2">
                                <div class="col" th:each="cast : ${perf.casts}">
                                    <div class="p-2 bg-white border rounded small">
                                        <span class="text-muted" th:text="${cast.roleName}">역할명</span>: 
                                        <strong class="text-dark" th:text="${cast.actorName}">배우명</strong>
                                    </div>
                                   
						            <div class="text-muted text-truncate mt-1" style="font-size: 0.85rem;" 
						                 th:if="${cast.description != null and !cast.description.isEmpty()}" 
						                 th:text="${cast.description}">
						                배역 설명
						            </div>
                                </div>
                                <div class="col-12" th:if="${perf.casts == null or perf.casts.isEmpty()}">
                                    <span class="small text-muted">등록된 캐스팅 정보가 없습니다.</span>
                                </div>
                            </div>


							<!-- 좌석 선택 및 관리 버튼 영역 -->
							<div class="mt-3 d-flex justify-content-between align-items-center">
							    <!-- 일반 사용자용 좌석 선택 버튼 -->
							    <a th:href="@{http://localhost:5173/seat/select(performanceId=${perf.performanceId})}"
								   class="btn btn-primary btn-sm px-4">
								    좌석 선택하기
								</a>
							</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 회차가 없을 경우 -->
            <div th:if="${concert.performanceList == null or concert.performanceList.isEmpty()}" class="text-center py-4">
                <p class="text-muted">현재 오픈된 예매 회차가 없습니다.</p>
            </div>
        </div>
        
        <div id="reviewSection" class="bg-white p-4 rounded shadow-sm mt-4">
            <h4 class="fw-bold mb-4 border-bottom pb-2">⭐ 관람 후기</h4>
            <div id="review-list-area">
                <div class="text-center py-4 text-muted">리뷰를 불러오는 중입니다...</div>
            </div>
        </div>
        
    </div>

    <!-- 부트스트랩 JS (아코디언 토글 기능 등에 필요) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	</body>

    <script th:inline="javascript">
        document.addEventListener("DOMContentLoaded", function() {
            const concertId = /*[[${concert.concertId}]]*/ 0;
            
            fetch(`/api/reviews/concert/${concertId}`)
                .then(response => response.json())
                .then(data => {
                    const reviewArea = document.getElementById('review-list-area');
                    reviewArea.innerHTML = ''; 
                    
                    const reviews = data.reviews || data; 

                    if (reviews.length === 0) {
                        reviewArea.innerHTML = '<div class="text-center py-4 text-muted">아직 작성된 리뷰가 없습니다.</div>';
                        return;
                    }

                    reviews.forEach(review => {
                        const stars = '★'.repeat(review.rating) + '☆'.repeat(5 - review.rating);
                        const date = review.createdAt ? review.createdAt.substring(0, 10) : '';

                        let html = `
                            <div class="card mb-3 border-0 border-bottom rounded-0 pb-3">
                                <div class="card-body p-0">
                                    <div class="d-flex justify-content-between align-items-center mb-2">
                                        <div>
                                            <span class="text-warning fs-5 me-2">${stars}</span>
                                            <span class="fw-bold">${review.memberName || '익명'}</span>
                                        </div>
                                        <span class="text-muted small">${date}</span>
                                    </div>
                                    <p class="card-text mb-2">${review.text}</p>
                        `;

                        if (review.imgUrl) {
                            html += `<img src="${review.imgUrl}" class="img-fluid rounded mt-2" style="max-height: 150px; object-fit: cover;" alt="리뷰 이미지">`;
                        }

                        html += `</div></div>`;
                        reviewArea.insertAdjacentHTML('beforeend', html);
                    });
                })
                .catch(error => {
                    document.getElementById('review-list-area').innerHTML = '<div class="text-center py-4 text-danger">리뷰를 불러오는 중 오류가 발생했습니다.</div>';
                });
        });
    </script>
</body>
</html>
